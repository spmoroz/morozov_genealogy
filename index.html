<meta charset="UTF-8">

<title>Родословная Морозовых</title>
<style>
:root{color-scheme:light;--bg:#f4f1ea;--card:#fff;--ink:#2b2b2b;--mut:#7a7468;--line:#cfc6b3;--accent:#7a5c3e;--hi:#2e7d32;--med:#b58900;--lo:#b34;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);color:#fdf8ef;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600}
header .stat{font-size:12px;opacity:.85}
#search{margin-left:auto;padding:7px 12px;border:none;border-radius:6px;min-width:220px;font-size:14px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;height:calc(100vh - 52px)}
#list{overflow:auto;border-right:1px solid var(--line);background:#efe9dc}
.lineGrp{padding:6px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);position:sticky;top:0;background:#e7e0cf}
.pitem{padding:7px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid #e3dccb}
.pitem:hover{background:#e3dccb}
.pitem .yr{color:var(--mut);font-size:12px}
#main{overflow:auto;padding:22px 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:760px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{margin:0 0 2px;font-size:24px}
.maiden{color:var(--mut);font-weight:400;font-size:16px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;vertical-align:middle;margin-left:8px}
.b-high{background:var(--hi)}.b-medium{background:var(--med)}.b-low{background:var(--lo)}
.meta{margin:14px 0;display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
.meta .k{color:var(--mut)}
.rel{margin-top:18px}
.rel h3{font-size:12px;text-transform:uppercase;color:var(--mut);margin:14px 0 6px;letter-spacing:.5px}
.chip{display:inline-block;background:#efe9dc;border:1px solid var(--line);border-radius:16px;padding:5px 12px;margin:3px 5px 3px 0;cursor:pointer;font-size:13px}
.chip:hover{background:#e0d8c4}
.chip.spouse{background:#f3e7d8;border-color:#d8c2a3}
.note{margin-top:16px;padding:12px 14px;background:#faf6ee;border-left:3px solid var(--accent);font-size:13px;color:#4a443a;border-radius:4px}
.ped{margin-top:8px;font-size:13px}
.ped ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.ped li{margin:4px 0}
.ped .pl{cursor:pointer;color:var(--accent)}
.ped .pl:hover{text-decoration:underline}
.editbtn{margin-top:18px;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 16px;cursor:pointer;font-size:14px}
.editbtn:hover{opacity:.9}
#editbox{display:none;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;max-width:760px}
#editbox textarea{width:100%;min-height:90px;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:inherit}
#editbox input{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sub{background:var(--hi);color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer}
.copy{background:#555;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer}
.legend{font-size:12px;color:var(--mut);margin-top:10px}

.backbtn{display:none;margin-bottom:10px;background:#efe9dc;border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer;font-size:14px}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 60px)}
  #list{border-right:none;border-bottom:1px solid var(--line);max-height:none;-webkit-overflow-scrolling:touch}
  #main{padding:14px 16px}
  header{padding:10px 14px}
  header h1{font-size:16px}
  #search{margin-left:0;width:100%;min-width:0;font-size:16px}
  body.detail #list{display:none}
  body:not(.detail) #main{display:none}
  .backbtn{display:inline-block}
  .pitem{padding:13px 14px;font-size:16px}
  .lineGrp{font-size:12px}
  .chip{padding:9px 14px;font-size:14px;margin:4px 6px 4px 0}
  .card{padding:14px;border:none;box-shadow:none;max-width:100%}
  .card h2{font-size:21px}
  .meta{grid-template-columns:100px 1fr;gap:6px 10px}
  .editbtn,.sub,.copy{padding:11px 16px;font-size:15px}
  #editbox input,#editbox textarea{font-size:16px}
}
</style>
</head>

const P = {}; DATA.persons.forEach(p=>P[p.id]=p);
const F = DATA.families;
const fams_as_child={}, fams_as_spouse={};
F.forEach(f=>{
  [f.husband_id,f.wife_id].forEach(s=>{if(s){(fams_as_spouse[s]=fams_as_spouse[s]||[]).push(f);}});
  (f.children_ids||"").split(";").map(x=>x.trim()).filter(Boolean).forEach(c=>{(fams_as_child[c]=fams_as_child[c]||[]).push(f);});
});
const childrenOf=fid=>(F.find(f=>f.fam_id===fid).children_ids||"").split(";").map(x=>x.trim()).filter(Boolean);
function years(p){const b=(p.birth_date||"").slice(0,4),d=(p.death_date||"").slice(0,4);if(!b&&!d)return"";return"("+(b||"?")+(d?"–"+d:"")+")";}
function fullName(p){return p.name+(p.maiden_name?" ("+p.maiden_name+")":"");}

document.getElementById('stat').textContent = DATA.persons.length+" персон · "+F.length+" семей · 8 линий";

function renderList(filter=""){
  const byLine={};
  DATA.persons.filter(p=>fullName(p).toLowerCase().includes(filter.toLowerCase()))
    .forEach(p=>{(byLine[p.line]=byLine[p.line]||[]).push(p);});
  const order=["Морозов","Костин","Прохоров","Миронов","Чуваков","Ефремов","Ушаков","Фомичев","Широнин","Балковский","Рогов","Михайлов","Глод-Сачук","боковая"];
  const keys=Object.keys(byLine).sort((a,b)=>(order.indexOf(a)+99*(order.indexOf(a)<0))-(order.indexOf(b)+99*(order.indexOf(b)<0)));
  let h="";
  keys.forEach(k=>{
    h+=`<div class="lineGrp">${k}</div>`;
    byLine[k].sort((a,b)=>(a.birth_date||"9").localeCompare(b.birth_date||"9")).forEach(p=>{
      h+=`<div class="pitem" onclick="show('${p.id}')">${p.name} <span class="yr">${years(p)}</span></div>`;
    });
  });
  document.getElementById('list').innerHTML=h;
}

function pedigree(id,depth){
  if(depth<=0||!fams_as_child[id])return"";
  const f=fams_as_child[id][0];
  let h="<ul>";
  [f.husband_id,f.wife_id].forEach(par=>{ if(par){const p=P[par];
    h+=`<li><span class="pl" onclick="show('${par}')">${p.name}</span> <span class="yr">${years(p)}</span>${pedigree(par,depth-1)}</li>`;}});
  return h+"</ul>";
}

function show(id){
  const p=P[id];
  const cb={high:"Документально",medium:"Вероятно",low:"Предположительно"}[p.confidence]||p.confidence;
  let h=`<div class="card"><button class="backbtn" onclick="backToList()">‹ К списку</button><h2>${p.name} ${p.maiden_name?'<span class="maiden">('+p.maiden_name+')</span>':''}<span class="badge b-${p.confidence}">${cb}</span></h2>`;
  h+=`<div class="meta">`;
  const add=(k,v)=>{if(v)h+=`<div class="k">${k}</div><div>${v}</div>`;};
  add("Пол",{M:"мужской",F:"женский"}[p.sex]||"");
  add("Рождение",[p.birth_date,p.birth_place].filter(Boolean).join(", "));
  add("Смерть",[p.death_date,p.death_place].filter(Boolean).join(", "));
  add("Линия",p.line);
  add("Источник",p.source);
  h+=`</div>`;
  // relations
  const parents=(fams_as_child[id]||[]).flatMap(f=>[f.husband_id,f.wife_id]).filter(Boolean);
  const spouses=(fams_as_spouse[id]||[]).map(f=>f.husband_id===id?f.wife_id:f.husband_id).filter(Boolean);
  const kids=(fams_as_spouse[id]||[]).flatMap(f=>childrenOf(f.fam_id));
  const sibs=(fams_as_child[id]||[]).flatMap(f=>childrenOf(f.fam_id)).filter(x=>x!==id);
  const chips=(arr,cls="")=>arr.map(x=>`<span class="chip ${cls}" onclick="show('${x}')">${P[x].name} <span class="yr">${years(P[x])}</span></span>`).join("")||'<span style="color:#999">—</span>';
  h+=`<div class="rel">`;
  h+=`<h3>Родители</h3>${chips(parents)}`;
  h+=`<h3>Супруг(а)</h3>${chips(spouses,"spouse")}`;
  h+=`<h3>Дети</h3>${chips(kids)}`;
  h+=`<h3>Братья / сёстры</h3>${chips(sibs)}`;
  h+=`</div>`;
  if(p.notes)h+=`<div class="note">${p.notes}</div>`;
  if(fams_as_child[id]){h+=`<div class="rel"><h3>Предки</h3><div class="ped">${pedigree(id,4)}</div></div>`;}
  h+=`<button class="editbtn" onclick="toggleEdit('${id}')">✏️ Предложить правку / комментарий</button>`;
  h+=`<div id="editbox">
        <div class="legend" style="margin-bottom:8px">Дополнить или поправить информацию об этом человеке. Ответ сохранится в базе Сергея (Google-таблица).</div>
        <div class="row">
          <button class="sub" onclick="openForm('${id}')">Открыть форму для этого человека</button>
          <button class="copy" onclick="copyLabel('${id}')">Скопировать метку</button>
        </div>
        <div class="legend" id="ed_status">При открытии метка («Кого касается» и ID) копируется в буфер — вставьте в первое поле формы.</div>
      </div>`;
  h+=`</div>`;
  document.getElementById('main').innerHTML=h;
  document.getElementById('main').scrollTop=0;
  document.body.classList.add('detail');
  window.scrollTo(0,0);
}
const GFORM="https://docs.google.com/forms/d/e/1FAIpQLScBpwS54dVNIzf_WCZ0nbQvW4zxYxzinALYMrhlsXkDvDAi9g/viewform";
function backToList(){document.body.classList.remove('detail');window.scrollTo(0,0);}
function toggleEdit(){const e=document.getElementById('editbox');e.style.display=e.style.display==='block'?'none':'block';}
function label(id){const p=P[id];return fullName(p)+" ["+id+"]";}
function copyLabel(id){navigator.clipboard.writeText(label(id)).then(()=>{document.getElementById('ed_status').textContent="Скопировано: «"+label(id)+"». Вставьте в поле «Кого касается».";});}
function openForm(id){
  const p=P[id];
  navigator.clipboard.writeText(label(id)).catch(()=>{});
  window.open(GFORM,"_blank");
  document.getElementById('ed_status').innerHTML="Форма открыта в новой вкладке. В поле <b>«Кого касается»</b> вставьте из буфера (⌘/Ctrl+V): «"+fullName(p)+"». В поле <b>«ID записи»</b> впишите: <b>"+id+"</b>. Затем ваше имя и текст.";
}

document.getElementById('search').addEventListener('input',e=>renderList(e.target.value));
renderList();
show('P001');
document.body.classList.remove('detail');
